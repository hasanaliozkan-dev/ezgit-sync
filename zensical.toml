[project]
site_name = "ezgit-sync"
site_url = "https://hasanaliozkan-dev.github.io/ezgit-sync/"
repo_url = "https://github.com/hasanaliozkan-dev/ezgit-sync"
repo_name = "hasanaliozkan-dev/ezgit-sync"

nav = [{ "Home" = "README.md" }]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
